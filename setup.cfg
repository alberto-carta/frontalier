[metadata]
name = frontier_builder
version = 0.1.0
description = Local frontier models from Quantum ESPRESSO / wannier90 dumps
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.8
install_requires =
    numpy>=1.18
    pymatgen>=2020.10
    matplotlib>=3.2

[options.packages.find]
where = src

[options.extras_require]
test =
    pytest>=7
